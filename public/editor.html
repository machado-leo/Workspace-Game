<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Visual de Mapas - Escritório Virtual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #11141a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      background: #1a1f2c;
      border-bottom: 1px solid #2d3748;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }
    .logo {
      font-weight: 700;
      font-size: 16px;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      background: #2b3547;
      color: #f1f5f9;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover { background: #3b475e; border-color: #64748b; }
    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
    }
    button.primary:hover { background: #1d4ed8; }
    button.success {
      background: #16a34a;
      border-color: #22c55e;
      color: white;
    }
    button.success:hover { background: #15803d; }
    
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    
    /* Painel Esquerdo - Ferramentas e Móveis */
    .sidebar {
      width: 250px;
      background: #181d28;
      border-right: 1px solid #2d3748;
      display: flex;
      flex-direction: column;
      z-index: 5;
      overflow-y: auto;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      padding: 12px 14px 6px;
      font-weight: 700;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 8px 12px;
    }
    .palette-btn {
      background: #1e2533;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      font-size: 11px;
      color: #cbd5e1;
      text-align: center;
      transition: all 0.15s ease;
    }
    .palette-btn:hover { background: #283347; border-color: #475569; }
    .palette-btn.active {
      background: #1e3a8a;
      border-color: #60a5fa;
      color: #93c5fd;
      font-weight: 600;
    }
    .palette-btn .icon { font-size: 18px; }

    /* Canvas Central */
    .canvas-container {
      flex: 1;
      position: relative;
      overflow: auto;
      background: #0f1218;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    canvas {
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #181b22;
      border: 2px solid #334155;
      cursor: crosshair;
      image-rendering: pixelated;
    }

    /* Painel Direito - Salas */
    .rooms-panel {
      width: 280px;
      background: #181d28;
      border-left: 1px solid #2d3748;
      display: flex;
      flex-direction: column;
      z-index: 5;
      overflow-y: auto;
    }
    .room-item {
      padding: 10px 14px;
      border-bottom: 1px solid #273142;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background 0.15s;
    }
    .room-item:hover { background: #222b3d; }
    .room-item.active { background: #1e2e4a; border-left: 4px solid #3b82f6; }
    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .room-name { font-weight: 600; font-size: 13px; color: #f1f5f9; }
    .room-color-badge { width: 12px; height: 12px; border-radius: 3px; }
    .room-desc { font-size: 11px; color: #94a3b8; }

    .room-editor-box {
      padding: 14px;
      background: #141822;
      border-top: 1px solid #2d3748;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label { font-size: 11px; font-weight: 600; color: #94a3b8; }
    .form-group input, .form-group select {
      background: #1e2533;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px 8px;
      color: #f1f5f9;
      font-size: 12px;
    }

    /* Barra Inferior */
    footer {
      background: #151922;
      border-top: 1px solid #2d3748;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
    }
    .status-msg { color: #4ade80; font-weight: 500; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>📐</span> Editor de Mapas do Escritório
    </div>
    <div class="top-actions">
      <span id="map-dims-badge" style="font-size: 12px; color: #94a3b8;">30 x 40</span>
      <button class="success" id="btn-salvar">
        <span>💾</span> Salvar no Jogo
      </button>
      <button id="btn-abrir-sede">
        <span>🎮</span> Abrir Sede
      </button>
      <button id="btn-exportar">
        <span>📥</span> Baixar JSON
      </button>
    </div>
  </header>

  <div class="workspace">
    <!-- BARRA LATERAL: FERRAMENTAS E MÓVEIS -->
    <div class="sidebar">
      <div class="section-title">Modo de Ação</div>
      <div class="palette-grid">
        <div class="palette-btn active" id="tool-paint">
          <span class="icon">✏️</span> Pincel
        </div>
        <div class="palette-btn" id="tool-rect">
          <span class="icon">⬛</span> Bloco Cheio
        </div>
        <div class="palette-btn" id="tool-room">
          <span class="icon">📐</span> Definir Sala
        </div>
        <div class="palette-btn" id="tool-spawn">
          <span class="icon">📍</span> Ponto Spawn
        </div>
      </div>

      <div class="section-title">Móveis e Elementos</div>
      <div class="palette-grid" id="tiles-palette">
        <!-- Gerado via JavaScript -->
      </div>
    </div>

    <!-- CANVAS CENTRAL -->
    <div class="canvas-container" id="canvas-wrap">
      <canvas id="editorCanvas"></canvas>
    </div>

    <!-- PAINEL DIREITO: SALAS E ACÚSTICA -->
    <div class="rooms-panel">
      <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>Salas e Ambientes</span>
        <button id="btn-nova-sala" style="padding: 2px 8px; font-size: 10px;">+ Nova</button>
      </div>
      <div id="rooms-list" style="flex: 1; overflow-y: auto;">
        <!-- Gerado via JavaScript -->
      </div>

      <div class="room-editor-box" id="room-editor" style="display: none;">
        <div class="section-title" style="padding: 0 0 6px 0;">Editar Sala</div>
        <div class="form-group">
          <label>Nome da Sala:</label>
          <input type="text" id="inp-room-name">
        </div>
        <div class="form-group">
          <label>Piso:</label>
          <select id="inp-room-floor">
            <option value="ladrilho">Ladrilho (Cerâmica clara)</option>
            <option value="madeira">Madeira escura</option>
            <option value="madeira_clara">Madeira clara</option>
            <option value="carpete_azul">Carpete azul (Trabalho)</option>
            <option value="carpete_roxo">Carpete roxo</option>
            <option value="espinha_fria">Espinha de peixe</option>
            <option value="tijolo">Tijolinho (Corredor)</option>
            <option value="cinza">Cimento cinza</option>
            <option value="grama">Grama externa</option>
          </select>
        </div>
        <div class="form-group">
          <label>Regra de Som / Chamada:</label>
          <select id="inp-room-sound">
            <option value="sala">Privativo ("sala" - não vaza p/ fora)</option>
            <option value="perto">Proximidade ("perto" - ouve ao redor)</option>
            <option value="silencio">Silencioso ("silêncio" - sem chamadas)</option>
          </select>
        </div>
        <button id="btn-demarcar-sala" class="primary" style="margin-top: 4px;">
          <span>📐</span> Demarcar Retângulo no Mapa
        </button>
      </div>
    </div>
  </div>

  <footer>
    <div id="coord-info">Linha: 0, Coluna: 0</div>
    <div id="status-bar" class="status-msg">Pronto</div>
    <div>Botão esquerdo: Pintar | Botão direito: Apagar</div>
  </footer>

  <script src="/js/editor.js"></script>
</body>
</html>
